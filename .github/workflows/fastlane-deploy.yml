name: fastlane-deploy

# 고속 차선(Cloudflare Worker)을 GitHub Actions에서 배포합니다.
# 로컬에서 `npx wrangler deploy`를 못 돌리는 환경을 위한 원격 배포 경로입니다.
# 수동 실행 전용(자동 트리거 없음). 필요한 시크릿:
#   CLOUDFLARE_API_TOKEN  — Edit Cloudflare Workers 권한 토큰
#   CLOUDFLARE_ACCOUNT_ID — 계정 ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wrangler 배포 (fastlane/)
        working-directory: fastlane
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
